<script data-page-node-id="lLJVDxkoKhbgJTLeoOXYWu" data-pnid-children="YAEIP3tHyzwOUtNKPLabzG">
var ITEMS = JSON.parse(document.getElementById('itemsJson').textContent);
var DATA = {};            // key -> {mime,b64,dur}
var MR=null, STREAM=null, CHUNKS=[], CUR=null, TIMER=null;

function el(id){ return document.getElementById(id) }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

function mkItem(it){
  var key=it[0], ch=it[1], tip=it[4]==='need'||it[4]==='ok' ? it[3] : '';
  var d=document.createElement('div');
  d.className='item'; d.setAttribute('data-k',key);
  d.innerHTML =
    '<div class="big">'+esc(ch)+'</div>'+
    '<div class="grow"><div class="key">'+esc(key)+'</div>'+
      (tip?'<div class="tip">'+esc(tip)+'</div>':'')+'</div>'+
    '<div class="row">'+
      '<button class="btn rec" data-act="rec">录音</button>'+
      '<button class="btn play" data-act="play" disabled>试听</button>'+
    '</div>';
  d.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    var a=b.getAttribute('data-act');
    if(a==='rec') onRec(key,b); else onPlay(key);
  });
  return d;
}

function render(){
  var need=ITEMS.filter(function(x){return x[4]==='need'});
  var ok  =ITEMS.filter(function(x){return x[4]==='ok'});
  var boxN=el('needList'), boxO=el('okList'), boxA=el('allList');
  need.forEach(function(x){ boxN.appendChild(mkItem(x)) });
  ok.forEach(function(x){ boxO.appendChild(mkItem(x)) });
  var grp={}, order=[];
  ITEMS.forEach(function(x){ var g=x[2]; if(!grp[g]){grp[g]=[];order.push(g)} grp[g].push(x) });
  order.forEach(function(g){
    var t=document.createElement('div'); t.className='grpt'; t.textContent=g+'（'+grp[g].length+'）';
    boxA.appendChild(t);
    grp[g].forEach(function(x){ boxA.appendChild(mkItem(x)) });
  });
}

function setBtns(key,mode){
  var d=document.querySelector('.item[data-k="'+key+'"]'); if(!d) return;
  var r=d.querySelector('[data-act="rec"]'), p=d.querySelector('[data-act="play"]');
  if(mode==='recording'){ r.textContent='停'; r.className='btn stop'; p.disabled=true; }
  else if(mode==='done'){ r.textContent='重录'; r.className='btn ghost'; p.disabled=false; }
  else { r.textContent='录音'; r.className='btn rec'; p.disabled=true; }
}

function pickMime(){
  var cand=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mpeg'];
  for(var i=0;i<cand.length;i++){ try{ if(window.MediaRecorder && MediaRecorder.isTypeSupported(cand[i])) return cand[i] }catch(e){} }
  return '';
}

function stopStream(){
  try{ if(STREAM) STREAM.getTracks().forEach(function(t){t.stop()}) }catch(e){}
  STREAM=null;
}

function onRec(key,btn){
  if(CUR===key && MR && MR.state==='recording'){ doStop(); return; }
  if(MR && MR.state==='recording') doStop();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    el('perm').style.display='block'; return;
  }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})
  .then(function(st){
    STREAM=st; CHUNKS=[]; CUR=key;
    var mime=pickMime();
    try{ MR = mime ? new MediaRecorder(st,{mimeType:mime}) : new MediaRecorder(st) }
    catch(e){ MR = new MediaRecorder(st) }
    MR.ondataavailable=function(e){ if(e.data && e.data.size) CHUNKS.push(e.data) };
    MR.onstop=function(){ finish(key) };
    MR.start();
    setBtns(key,'recording');
    TIMER=setTimeout(function(){ if(MR && MR.state==='recording') doStop() }, 2500);
  })
  .catch(function(e){ el('perm').style.display='block' });
}

function doStop(){
  clearTimeout(TIMER);
  try{ if(MR && MR.state!=='inactive') MR.stop() }catch(e){ finish(CUR) }
}

function finish(key){
  clearTimeout(TIMER);
  var mime=(MR&&MR.mimeType)||pickMime()||'audio/webm';
  if(!CHUNKS.length){ setBtns(key,'idle'); stopStream(); CUR=null; return; }
  var blob=new Blob(CHUNKS,{type:mime});
  var fr=new FileReader();
  fr.onload=function(){
    var s=String(fr.result||'');
    var i=s.indexOf(',');
    DATA[key]={mime:mime, b64: i>=0 ? s.slice(i+1) : s};
    setBtns(key,'done');
    updCnt();
  };
  fr.onerror=function(){ setBtns(key,'idle') };
  fr.readAsDataURL(blob);
  stopStream(); CUR=null;
}

function onPlay(key){
  var d=DATA[key]; if(!d) return;
  try{
    var a=new Audio('data:'+d.mime+';base64,'+d.b64);
    a.play();
  }catch(e){}
}

function updCnt(){
  var n=Object.keys(DATA).length;
  el('cnt').textContent=n;
  el('genBtn').disabled = n===0;
}

function build(){
  return JSON.stringify({ver:'rec-1', agent:'小学学习乐园', items:DATA});
}

el('genBtn').addEventListener('click',function(){
  var s=build();
  el('out').value=s;
  el('cpMsg').textContent='共 '+s.length+' 个字符';
  el('mask').classList.add('on');
});
el('clBtn').addEventListener('click',function(){ el('mask').classList.remove('on') });
el('cpBtn').addEventListener('click',function(){
  var t=el('out');
  t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0,999999);
  var done=false;
  try{ done=document.execCommand('copy') }catch(e){}
  t.setAttribute('readonly','readonly');
  if(!done && navigator.clipboard){ navigator.clipboard.writeText(t.value).then(function(){
    el('cpMsg').textContent='已复制，回聊天粘贴发给我';
  }); return; }
  el('cpMsg').textContent = done ? '已复制，回聊天粘贴发给我' : '复制失败，请手动长按选中上面文字复制';
});
el('dlBtn').addEventListener('click',function(){
  var b=new Blob([build()],{type:'application/json'});
  var u=URL.createObjectURL(b);
  var a=document.createElement('a');
  a.href=u; a.download='我的发音_'+Object.keys(DATA).length+'个.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u) },3000);
});

render(); updCnt();
</script>
